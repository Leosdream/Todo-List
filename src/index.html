<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>TODO LIST</title>
</head>
<body>
    <div class="container">
    <div id="sideBar" style="color: white; text-align: center;"> ToDo App
        <button id="userName" style="margin-bottom: 10px;"> User (tap to change)</button>
        <dialog id="userName-dialog">
            <form method="dialog" id="userName-form">
                <input type="text" id="userName-title" placeholder="userName title" required>
                <button id="submit" type="submit">Confirm</button>
            </form>
        </dialog>
        <button id="sideBarButton">SideBarButton </button>
        <!-- add a sidBarButton graphic -->
         <div id="inbox"> 
         <button id="inboxBtn" class="inboxBtn active"> Inbox
         </button>
    </div>
         <div id="containerProject">
            <div id="myProjects"> My Projects
                <button id="addProjectButton" style="font-size: 20px;">+</button>
                <!-- add plus icon -->
            </div>

            <dialog id="project-dialog">
                <form method="dialog" id="project-form">
                    <h2>Create New Project</h2>
                    
                    <label for="project-name">Project Name</label>
                    <input type="text" id="project-name" placeholder="e.g. Work, Gym, Personal" required>
                    
                    <div class="dialog-buttons">
                    <button type="button" id="cancel-project-btn">Cancel</button>
                    <button type="submit" class="confirm-project-btn"id="confirm-project-btn">Create</button>
                    </div>
                </form>
            </dialog>

         </div>
    </div>
    <div id="main">
        <button id="new-Task">+</button>
        <dialog id="task-dialog">
    <form method="dialog" id="task-form">
        <h2>Create New Task</h2>
        
        <label for="task-name">Task Name</label>
        <input type="text" id="task-name" placeholder="e.g. Work, Gym, Personal" required>
        
        <label for="task-description">Task Description</label>
        <input type="text" id="task-description" placeholder="Optional">
        
        <label for="task-dueDate">Due Date</label>
        <input type="date" id="task-dueDate">
       
        <label for="task-priority">Priority</label>
        <select id="task-priority" name="priority">
            <option value="" selected>None</option>
            <option value="low">Low</option>
            <option value="medium">Medium</option>
            <option value="high">High</option>
        </select>
        
        <div class="task-buttons">
            <button type="button" id="cancel-task-btn">Cancel</button>
            <button type="submit" id="confirm-task-btn">Create</button>
        </div>
    </form>
</dialog>
            <div id="conatiner-main">
                
        </div>

            </div>
    </div>
    </div>


    <dialog id="editDialog">
                    <form method="dialog" id="edit-form">
                        <h2>Edit Task</h2>
                        <label for="dialogEditText">Input Edit</label>
                        <input type="text" id="dialogEditText" required>
                        <div class="dialog-text-edit-buttons">
                <button type="button" id="cancel-text-edit-buttons">Cancel</button>
                <button type="submit" id="confirm-text-edit-buttons">Create</button>
                        </div>
                        </form>
                    </dialog>

                    <dialog id="editDialog-date">
                    <form method="dialog" id="edit-form-date">
                        <h2>Edit Task</h2>
                        <label for="dialogEditText-date">Input Edit</label>
                        <input type="date" id="dialogEditText-date" required>
                        <div class="dialog-text-edit-buttons-date">
                <button type="button" id="cancel-text-edit-buttons-date">Cancel</button>
                <button type="submit" id="confirm-text-edit-buttons-date">Create</button>
                        </div>
                        </form>
                    </dialog>

                    <dialog id="editDialog-priority">
                    <form method="dialog" id="edit-form-priority">
                        <h2>Edit Task</h2> 
                       
                        <label for="dialogEditText-priority">Priority Edit</label>
        <select id="dialogEditText-priority" name="priority">
            <option value="" selected>None</option>
            <option value="low">Low</option>
            <option value="medium">Medium</option>
            <option value="high">High</option>
        </select>
                        <div class="dialog-text-edit-buttons-priority">
                <button type="button" id="cancel-text-edit-buttons-priority">Cancel</button>
                <button type="submit" id="confirm-text-edit-buttons-priority">Create</button>
                        </div>
                        </form>
                    </dialog>
</body>
</html>
